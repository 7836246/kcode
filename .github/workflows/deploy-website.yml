name: deploy-website

on:
  push:
    branches: [main]
    paths:
      - "apps/website/**"
      - ".github/workflows/deploy-website.yml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

concurrency:
  group: deploy-website
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build website
        run: pnpm --filter @kcode/website build

      - name: Sync to origin
        env:
          WEBSITE_DEPLOY_KEY: ${{ secrets.WEBSITE_DEPLOY_KEY }}
          WEBSITE_HOST: 23.94.223.164
        run: |
          if [ -z "$WEBSITE_DEPLOY_KEY" ]; then
            echo "missing WEBSITE_DEPLOY_KEY" >&2
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$WEBSITE_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 22 -H "$WEBSITE_HOST" >> ~/.ssh/known_hosts
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p 22" \
            apps/website/dist/ \
            "root@${WEBSITE_HOST}:/var/www/kcode.wiki/"
