name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  COREPACK_ENABLE_PROJECT_SPEC: "0"

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Architecture
        run: pnpm architecture:check

      - name: Focused tests
        run: |
          pnpm exec tsx --test \
            packages/ui/test/modelConnectivityFailure.test.ts \
            packages/ui/test/loginApiKeyContinue.test.ts \
            packages/ui/test/turnMetrics.test.ts
          node --test packages/desktop/scripts/release-signing-plan.test.mjs
