<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#161616" />
    <meta name="color-scheme" content="dark" />
    <!-- Chrome dev 下可能不发 favicon 网络请求；内嵌小尺寸 App 图标，避免标签页回退到默认图标。-->
    <link
      rel="icon"
      type="image/png"
      href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAABy0lEQVR4nO2XT8sxURjGf4M8RSkbstSs2IjYWs8H4AvYyMYsWCiysbKirMZGKctZUgrFB1CS+ADKzixsyMKzomeG933zb/TWc63Oue7pXL9zmjnNLXBDbrf7dMt/VpqmCUZPZ7wr+G8gFrPDjVkWs8ONEJZ/PfhuCZ/Y/U99/AT+H4BAIMBqtaLf72O326/qXq+X4XDIYrFAFMXXA0iShMfjIRaLEQqFdDWXy4WqqoTDYXw+H36///UAP3ftcDh0frvdJhgMAtDpdBgMBq8HuCVBEGg0GsTjcQCazSbZbPauNZ4CKJfLJJNJAGq1GoVCgdPpvq/6YYBUKoUsywCoqkqlUnlonYcAJEmiWq3q5ve8eE8DpNNprFbrZe50OlEURee9FQBguVySSCTY7/cARKNRcrmcOQDj8RhJkhiNRhSLxYufz+eJRCLvB6jX6+x2OwBarRbdbhcAm82Goii6e+ItAEbJssxmswFAFEXdqbwM4HA4XMbH41FX2263ZDKZyx2QSqX4+vp6LUCv12O9XjOfz5nNZlf1yWRCqVRC0zSm0+kV5J/0+0PyC/B5gFvtklnSNE34/AmcScwOPmdajIaZ4WDojs8ysz3/Bui8m3+M0FTPAAAAAElFTkSuQmCC"
      sizes="32x32"
    />
    <title>KCode</title>
    <script>
      (() => {
        // JS bundle 执行前先按本地主题偏好决定首屏底色，避免 dark 用户在这一帧看到白底闪烁。
        const STORAGE_KEY = "kcode-theme";
        const DEFAULT_THEME = "zai-dark";
        const BROWSER_THEME_COLORS = {
          dark: "#161616",
          light: "#f8f8f8",
        };

        const normalizeResolvedTheme = (theme) => {
          if (theme === "dark") return "dark";
          if (theme === "light") return "light";
          if (theme === "zai-dark") return "dark";
          if (theme === "zai-light") return "light";
          return theme;
        };

        const syncBrowserThemeSurface = (theme) => {
          document.documentElement.setAttribute("data-kcode-browser-theme-surface", theme);
          document.documentElement.style.colorScheme = theme;
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute("content", BROWSER_THEME_COLORS[theme]);
          document.querySelector('meta[name="color-scheme"]')?.setAttribute("content", theme);
        };

        try {
          const saved = localStorage.getItem(STORAGE_KEY) || DEFAULT_THEME;
          const resolved =
            saved === "system"
              ? window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : normalizeResolvedTheme(saved);
          const finalTheme = resolved === "dark" ? "dark" : "light";
          document.documentElement.setAttribute("data-kcode-bootstrap-theme", finalTheme);
          syncBrowserThemeSurface(finalTheme);
          if (finalTheme === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch {
          document.documentElement.setAttribute("data-kcode-bootstrap-theme", "dark");
          syncBrowserThemeSurface("dark");
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background: var(--kcode-bootstrap-bg, var(--color-background, #0f172a));
        color: var(--kcode-bootstrap-fg, var(--color-foreground, #e2e8f0));
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      html[data-kcode-bootstrap-theme="light"] body {
        background: var(--kcode-bootstrap-bg, var(--color-background, #f8fafc));
        color: var(--kcode-bootstrap-fg, var(--color-foreground, #334155));
      }

      html[data-kcode-browser-theme-surface],
      html[data-kcode-browser-theme-surface] body,
      html[data-kcode-browser-theme-surface] #root {
        /* 共享 UI 样式为 Electron vibrancy 强制透明根背景；浏览器入口必须用语义背景
           覆盖该桌面专属行为，否则浏览器工具栏、overscroll 和页面画布会回退为系统白色。 */
        background: var(--color-background, var(--kcode-bootstrap-bg, #161616)) !important;
      }

      html[data-kcode-browser-theme-surface="light"],
      html[data-kcode-browser-theme-surface="light"] body,
      html[data-kcode-browser-theme-surface="light"] #root {
        background: var(--color-background, var(--kcode-bootstrap-bg, #f8f8f8)) !important;
      }

      .kcode-boot-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        /* UI 全局样式会把 body/#root 置为透明，预渲染壳必须自己承接主题背景，否则深色主题会露出浏览器白底。*/
        background: var(--kcode-bootstrap-bg, var(--color-background, #0f172a));
        color: var(--kcode-bootstrap-fg, var(--color-foreground, #e2e8f0));
      }

      html[data-kcode-bootstrap-theme="light"] .kcode-boot-loading {
        background: var(--kcode-bootstrap-bg, var(--color-background, #f8fafc));
        color: var(--kcode-bootstrap-fg, var(--color-foreground, #334155));
      }

      .kcode-boot-loading__logo-shell {
        position: relative;
        display: flex;
        width: 96px;
        height: 96px;
        align-items: center;
        justify-content: center;
        border-radius: 24px;
        background: linear-gradient(180deg, #000000 0%, #151718 100%);
        box-shadow:
          0 20px 25px -5px rgb(0 0 0 / 0.2),
          0 8px 10px -6px rgb(0 0 0 / 0.2);
      }

      .kcode-boot-loading__logo-shell::before {
        position: absolute;
        inset: 0;
        pointer-events: none;
        content: "";
        /* 启动 logo 壳是固定深色底，边框不能跟随浅色主题 token，否则首屏边框过重。*/
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: inherit;
      }

      .kcode-boot-loading__logo {
        width: 56px;
        height: auto;
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- 远程控制跨 workspace 时会整页跳转；在 JS 入口执行前先给出 loading 壳，避免出现白屏空档。-->
      <div
        class="kcode-boot-loading"
        role="status"
        aria-live="polite"
        aria-busy="true"
        aria-label="Loading..."
      >
        <div class="kcode-boot-loading__logo-shell">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="118px"
            height="100px"
            fill="none"
            viewBox="0 0 256 218"
            class="kcode-boot-loading__logo"
            aria-hidden="true"
          >
            <g fill="none" stroke="currentColor" stroke-width="44" stroke-linecap="round" stroke-linejoin="round">
              <path d="M64 24 V194" />
              <path d="M80 109 L208 24" />
              <path d="M80 109 L208 194" />
              <animate attributeName="opacity" dur="1.5s" repeatCount="indefinite" values="1;0.3;1" />
            </g>
          </svg>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
